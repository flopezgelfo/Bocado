<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bocado App</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');
    .bocado * { box-sizing: border-box; }
    .bocado { font-family: 'Inter', sans-serif; }
    .f-display { font-family: 'Fraunces', serif; }
    .f-mono { font-family: 'JetBrains Mono', monospace; }
    .bocado ::-webkit-scrollbar { width: 6px; }
    .bocado ::-webkit-scrollbar-thumb { background: #DCD3B8; border-radius: 4px; }
    .tab-btn { transition: color .15s ease, transform .1s ease; }
    .tab-btn:active { transform: scale(0.94); }
    .pulse-dot { animation: bocado-pulse 1.4s ease-in-out infinite; }
    @keyframes bocado-pulse { 0%,100%{opacity:.35} 50%{opacity:1} }
    .bar-fill { transition: width .5s cubic-bezier(.22,1,.36,1); }
    .rise-in { animation: bocado-rise .28s cubic-bezier(.22,1,.36,1) both; }
    @keyframes bocado-rise { from { opacity:0; transform: translateY(10px);} to { opacity:1; transform:none; } }
    .toast-in { animation: bocado-toast .25s ease both; }
    @keyframes bocado-toast { from { opacity:0; transform: translateY(-8px);} to { opacity:1; transform:none; } }
    input:focus, button:focus, textarea:focus, select:focus { outline: 2px solid #A8432B; outline-offset: 2px; }
  </style>
</head>
<body class="bg-[#F1ECDD]">
  <div id="root"></div>

  <script>
    const e = React.createElement;
    const { useState, useEffect, useRef, useCallback } = React;

    if (!window.storage) {
      window.storage = {
        get: async (key) => {
          const val = localStorage.getItem(key);
          return val ? { value: val } : null;
        },
        set: async (key, value) => {
          localStorage.setItem(key, value);
        }
      };
    }

    const Icon = ({ name, size = 18, color, className = "", style = {} }) => {
      const ref = useRef(null);
      useEffect(() => {
        if (ref.current && window.lucide) {
          ref.current.innerHTML = `<i data-lucide="${name}" style="width:${size}px; height:${size}px; color:${color || 'inherit'};"></i>`;
          window.lucide.createIcons({ attrs: { strokeWidth: 2 }, nameAttr: 'data-lucide', el: ref.current });
        }
      }, [name, size, color]);
      return e('span', { ref, className: `inline-flex items-center justify-center ${className}`, style });
    };

    const COLORS = {
      paper: "#F1ECDD", card: "#FBF8F0", ink: "#262319", inkSoft: "#5B5646",
      line: "#DCD3B8", brick: "#A8432B", matcha: "#5C6B3F", mustard: "#D9A441",
      plum: "#6E4A5E", teal: "#3E6E6A"
    };

    const ACTIVITY_LEVELS = [
      { key: "sedentario", label: "Sedentario", desc: "Poco o nada de ejercicio", mult: 1.2 },
      { key: "ligero", label: "Ligero", desc: "Ejercicio 1-3 días por semana", mult: 1.375 },
      { key: "moderado", label: "Moderado", desc: "Ejercicio 3-5 días por semana", mult: 1.55 },
      { key: "activo", label: "Activo", desc: "Ejercicio 6-7 días por semana", mult: 1.725 },
      { key: "muy_activo", label: "Muy activo", desc: "Entrenamiento intenso", mult: 1.9 },
    ];

    const GOAL_OPTIONS = [
      { key: "perder", label: "Bajar de peso", desc: "Déficit calórico moderado" },
      { key: "mantener", label: "Mantener peso", desc: "Calorías en línea con tu gasto" },
      { key: "ganar", label: "Ganar músculo", desc: "Superávit calórico moderado" },
    ];

    const todayStr = () => new Date().toISOString().slice(0, 10);
    const fmtDate = (d) => {
      const date = new Date(d + "T00:00:00");
      return date.toLocaleDateString("es-AR", { weekday: "short", day: "numeric", month: "short" });
    };

    function computeGoals(p) {
      const weightKg = Number(p.weightKg) || 0;
      const heightCm = Number(p.heightCm) || 0;
      const age = Number(p.age) || 0;
      const bmr = p.sex === "m"
        ? 10 * weightKg + 6.25 * heightCm - 5 * age + 5
        : 10 * weightKg + 6.25 * heightCm - 5 * age - 161;
      const level = ACTIVITY_LEVELS.find((a) => a.key === p.activity) || ACTIVITY_LEVELS[1];
      let tdee = bmr * level.mult;
      let calories = tdee;
      if (p.goal === "perder") calories = tdee - 450;
      if (p.goal === "ganar") calories = tdee + 350;
      calories = Math.max(1200, Math.round(calories));
      const proteinPerKg = p.goal === "perder" ? 2.2 : p.goal === "ganar" ? 2.0 : 1.8;
      const protein = Math.round(weightKg * proteinPerKg);
      const fat = Math.round((calories * 0.27) / 9);
      const carbs = Math.max(50, Math.round((calories - protein * 4 - fat * 9) / 4));
      const waterMl = Math.round(weightKg * 35 + (level.key === "activo" || level.key === "muy_activo" ? 400 : 0));
      const creatineG = Math.min(8, Math.max(3, Math.round(weightKg * 0.03 * 2) / 2));
      return { calories, protein, carbs, fat, waterMl, creatineG };
    }

    function todayTotals(meals) {
      const t = { calories: 0, protein: 0, carbs: 0, fat: 0 };
      meals.filter((m) => m.date === todayStr()).forEach((m) => {
        t.calories += m.calories; t.protein += m.protein; t.carbs += m.carbs; t.fat += m.fat;
      });
      return t;
    }

    function pct(consumed, goal) {
      if (!goal) return 0;
      return Math.min(100, Math.round((consumed / goal) * 100));
    }

    function OnboardingWizard({ onFinish }) {
      const [step, setStep] = useState(0);
      const [data, setData] = useState({ sex: "", age: "", weightKg: "", heightCm: "", activity: "", goal: "" });
      const [notifDraft, setNotifDraft] = useState({ enabled: false, waterIntervalH: 2, creatineTime: "09:00", mealReminder: true });

      const canNext = [
        !!data.sex && Number(data.age) > 0,
        Number(data.weightKg) > 0 && Number(data.heightCm) > 0,
        !!data.activity,
        !!data.goal,
        true,
      ][step];

      const preview = step >= 3 && data.goal ? computeGoals(data) : null;

      return e('div', { className: 'fixed inset-0 z-50 flex items-center justify-center p-5', style: { background: 'rgba(38,35,25,0.55)' } },
        e('div', { className: 'rise-in w-full rounded-2xl p-5', style: { background: COLORS.paper, maxWidth: 420, maxHeight: '90vh', overflowY: 'auto' } },
          e('div', { className: 'flex items-center gap-2 mb-1' },
            e('div', { className: 'rounded-full flex items-center justify-center', style: { width: 30, height: 30, background: COLORS.brick } },
              e(Icon, { name: 'utensils-crossed', size: 15, color: COLORS.card })
            ),
            e('h2', { className: 'f-display text-xl font-semibold' }, 'Contame sobre vos')
          ),
          e('p', { className: 'text-sm mb-4', style: { color: COLORS.inkSoft } }, 'Configurá tus datos iniciales para calcular tus metas.'),
          e('div', { className: 'flex gap-1 mb-4' },
            [0, 1, 2, 3, 4].map((i) => e('div', { key: i, className: 'h-1 flex-1 rounded-full', style: { background: i <= step ? COLORS.brick : COLORS.line } }))
          ),
          step === 0 && e('div', { className: 'flex flex-col gap-4' },
            e('div', null,
              e('p', { className: 'text-xs font-medium mb-2', style: { color: COLORS.inkSoft } }, 'Sexo biológico'),
              e('div', { className: 'flex gap-2' },
                [{ k: "m", l: "Masculino" }, { k: "f", l: "Femenino" }].map((o) =>
                  e('button', { key: o.k, onClick: () => setData({ ...data, sex: o.k }), className: 'flex-1 rounded-lg py-2.5 text-sm', style: { background: data.sex === o.k ? COLORS.brick : COLORS.card, color: data.sex === o.k ? COLORS.card : COLORS.ink, border: `1px solid ${COLORS.line}` } }, o.l)
                )
              )
            ),
            e('label', { className: 'text-xs font-medium', style: { color: COLORS.inkSoft } }, 'Edad',
              e('input', { type: 'number', value: data.age, onChange: (ev) => setData({ ...data, age: ev.target.value }), className: 'mt-1 w-full rounded-md px-3 py-2 text-sm', style: { background: COLORS.card, border: `1px solid ${COLORS.line}`, color: COLORS.ink } })
            )
          ),
          step === 1 && e('div', { className: 'flex flex-col gap-4' },
            e('label', { className: 'text-xs font-medium', style: { color: COLORS.inkSoft } }, 'Peso (kg)',
              e('input', { type: 'number', value: data.weightKg, onChange: (ev) => setData({ ...data, weightKg: ev.target.value }), className: 'w-full rounded-md px-3 py-2 text-sm f-mono', style: { background: COLORS.card, border: `1px solid ${COLORS.line}`, color: COLORS.ink } })
            ),
            e('label', { className: 'text-xs font-medium', style: { color: COLORS.inkSoft } }, 'Altura (cm)',
              e('input', { type: 'number', value: data.heightCm, onChange: (ev) => setData({ ...data, heightCm: ev.target.value }), className: 'w-full rounded-md px-3 py-2 text-sm f-mono', style: { background: COLORS.card, border: `1px solid ${COLORS.line}`, color: COLORS.ink } })
            )
          ),
          step === 2 && e('div', { className: 'flex flex-col gap-2' },
            ACTIVITY_LEVELS.map((a) =>
              e('button', { key: a.key, onClick: () => setData({ ...data, activity: a.key }), className: 'text-left rounded-lg px-3 py-2.5', style: { background: data.activity === a.key ? COLORS.brick : COLORS.card, border: `1px solid ${COLORS.line}` } },
                e('p', { className: 'text-sm font-medium', style: { color: data.activity === a.key ? COLORS.card : COLORS.ink } }, a.label),
                e('p', { className: 'text-xs', style: { color: data.activity === a.key ? 'rgba(251,248,240,.8)' : COLORS.inkSoft } }, a.desc)
              )
            )
          ),
          step === 3 && e('div', { className: 'flex flex-col gap-2' },
            GOAL_OPTIONS.map((g) =>
              e('button', { key: g.key, onClick: () => setData({ ...data, goal: g.key }), className: 'text-left rounded-lg px-3 py-2.5', style: { background: data.goal === g.key ? COLORS.brick : COLORS.card, border: `1px solid ${COLORS.line}` } },
                e('p', { className: 'text-sm font-medium', style: { color: data.goal === g.key ? COLORS.card : COLORS.ink } }, g.label),
                e('p', { className: 'text-xs', style: { color: data.goal === g.key ? 'rgba(251,248,240,.8)' : COLORS.inkSoft } }, g.desc)
              )
            )
          ),
          step === 4 && preview && e('div', { className: 'flex flex-col gap-3' },
            e('div', { className: 'rounded-lg p-3', style: { background: COLORS.card, border: `1px solid ${COLORS.line}` } },
              e('p', { className: 'text-xs font-semibold mb-2', style: { color: COLORS.inkSoft } }, 'TUS OBJETIVOS'),
              e('div', { className: 'grid grid-cols-2 gap-2 f-mono text-sm' },
                e('span', null, `🔥 ${preview.calories} kcal`),
                e('span', null, `🥩 ${preview.protein}g proteína`),
                e('span', null, `🌾 ${preview.carbs}g carbos`),
                e('span', null, `💧 ${(preview.waterMl / 1000).toFixed(1)}L agua`)
              )
            )
          ),
          e('div', { className: 'flex gap-2 mt-5' },
            step > 0 && e('button', { onClick: () => setStep(step - 1), className: 'rounded-lg px-4 py-2.5 text-sm', style: { border: `1px solid ${COLORS.line}`, color: COLORS.inkSoft } }, 'Atrás'),
            step < 4 ? e('button', { disabled: !canNext, onClick: () => setStep(step + 1), className: 'flex-1 rounded-lg py-2.5 text-sm font-medium', style: { background: COLORS.brick, color: COLORS.card, opacity: canNext ? 1 : 0.5 } }, 'Siguiente') :
            e('button', { onClick: () => onFinish(data, notifDraft), className: 'flex-1 rounded-lg py-2.5 text-sm font-medium', style: { background: COLORS.brick, color: COLORS.card } }, 'Empezar')
          )
        )
      );
    }

    function BocadoApp() {
      const [ready, setReady] = useState(false);
      const [profile, setProfile] = useState(null);
      const [goals, setGoals] = useState({ calories: 2000, protein: 150, carbs: 200, fat: 65, waterMl: 2500, creatineG: 5 });
      const [meals, setMeals] = useState([]);
      const [water, setWater] = useState({});
      const [creatine, setCreatine] = useState({});
      const [showOnboarding, setShowOnboarding] = useState(false);
      const [tab, setTab] = useState("hoy");

      useEffect(() => {
        (async () => {
          let pr = null, g = null, m = [], w = {}, cr = {};
          try { const r = await window.storage.get("bocado:profile"); if (r) pr = JSON.parse(r.value); } catch {}
          try { const r = await window.storage.get("bocado:goals"); if (r) g = JSON.parse(r.value); } catch {}
          try { const r = await window.storage.get("bocado:meals"); if (r) m = JSON.parse(r.value); } catch {}
          try { const r = await window.storage.get("bocado:water"); if (r) w = JSON.parse(r.value); } catch {}
          try { const r = await window.storage.get("bocado:creatine"); if (r) cr = JSON.parse(r.value); } catch {}

          if (!pr || !g) setShowOnboarding(true);
          if (pr) setProfile(pr);
          if (g) setGoals(g);
          setMeals(m); setWater(w); setCreatine(cr);
          setReady(true);
        })();
      }, []);

      const persist = async (key, value, setter) => {
        setter(value);
        try { await window.storage.set(key, JSON.stringify(value)); } catch {}
      };

      const finishOnboarding = (data, notifDraft) => {
        const computed = computeGoals(data);
        persist("bocado:profile", data, setProfile);
        persist("bocado:goals", computed, setGoals);
        setShowOnboarding(false);
      };

      if (!ready) return e('div', { className: 'bocado min-h-screen flex items-center justify-center', style: { background: COLORS.paper } }, e(Icon, { name: 'loader-2', className: 'animate-spin', size: 22, color: COLORS.brick }));

      const totals = todayTotals(meals);
      const todayMeals = meals.filter((m) => m.date === todayStr());
      const waterToday = water[todayStr()] || 0;

      return e('div', { className: 'bocado min-h-screen flex flex-col', style: { background: COLORS.paper, color: COLORS.ink } },
        e('header', { className: 'px-5 pt-6 pb-3 flex items-center justify-between' },
          e('div', { className: 'flex items-center gap-2' },
            e('div', { className: 'rounded-full flex items-center justify-center', style: { width: 30, height: 30, background: COLORS.brick } },
              e(Icon, { name: 'utensils-crossed', size: 15, color: COLORS.card })
            ),
            e('h1', { className: 'f-display text-2xl font-semibold' }, 'Bocado')
          )
        ),
        e('main', { className: 'flex-1 overflow-y-auto px-5 pb-28', style: { maxWidth: 480, margin: '0 auto', width: '100%' } },
          tab === "hoy" && e('div', { className: 'rise-in' },
            e('div', { className: 'rounded-lg p-4', style: { background: COLORS.card, border: `1.5px solid ${COLORS.ink}` } },
              e('h2', { className: 'f-display text-xl font-semibold mb-2' }, 'Hoy'),
              e('p', { className: 'f-mono text-sm' }, `Calorías: ${Math.round(totals.calories)} / ${goals.calories} kcal`)
            ),
            e('div', { className: 'rounded-lg p-4 mt-3', style: { background: COLORS.card, border: `1px solid ${COLORS.line}` } },
              e('p', { className: 'text-sm font-medium mb-2' }, `Agua: ${(waterToday / 1000).toFixed(1)}L / ${(goals.waterMl / 1000).toFixed(1)}L`),
              e('div', { className: 'flex gap-2' },
                e('button', { onClick: () => { const day = todayStr(); persist("bocado:water", { ...water, [day]: waterToday + 250 }, setWater); }, className: 'flex-1 rounded-md py-2 text-xs', style: { background: COLORS.teal, color: COLORS.card } }, '+ Vaso (250ml)')
              )
            ),
            e('div', { className: 'mt-6' },
              e('h3', { className: 'text-sm font-semibold mb-2', style: { color: COLORS.inkSoft } }, 'Comidas de hoy'),
              todayMeals.length === 0 && e('div', { className: 'rounded-lg p-5 text-center', style: { background: COLORS.card, border: `1px dashed ${COLORS.line}` } },
                e('p', { className: 'text-sm', style: { color: COLORS.inkSoft } }, 'No hay comidas registradas hoy.')
              )
            )
          ),
          tab === "perfil" && e('div', { className: 'rise-in pt-1' },
            e('h2', { className: 'f-display text-xl font-semibold mb-3' }, 'Perfil y Metas'),
            e('div', { className: 'rounded-lg p-4', style: { background: COLORS.card, border: `1px solid ${COLORS.line}` } },
              e('p', { className: 'text-sm' }, profile ? `Objetivo activo: ${profile.goal}` : 'Sin perfil configurado')
            )
          )
        ),
        e('nav', { className: 'fixed bottom-0 left-0 right-0 flex items-center justify-around py-2.5', style: { background: COLORS.card, borderTop: `1px solid ${COLORS.line}` } },
          [
            { key: "hoy", label: "Hoy", icon: "home" },
            { key: "perfil", label: "Perfil", icon: "settings" },
          ].map((t) =>
            e('button', { key: t.key, onClick: () => setTab(t.key), className: 'tab-btn flex flex-col items-center gap-0.5 px-3', style: { color: tab === t.key ? COLORS.brick : COLORS.inkSoft } },
              e(Icon, { name: t.icon, size: 19 }),
              e('span', { className: 'text-[10px] font-medium' }, t.label)
            )
          )
        ),
        showOnboarding && e(OnboardingWizard, { onFinish: finishOnboarding })
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(e(BocadoApp));
  </script>
</body>
</html>
